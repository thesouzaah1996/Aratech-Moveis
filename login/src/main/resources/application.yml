spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:producao}
  application:
    name: aratech-login
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

server:
  port: 8080

management:
  health:
    mail:
      enabled: false
