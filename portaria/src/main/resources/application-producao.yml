spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${PORTARIA_DB_USER_PROD}
    password: ${PORTARIA_DB_PASSWORD_PROD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: portaria-pool-prod
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: aratech-portaria-carga-liberada
      auto-offset-reset: earliest

  flyway:
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

aratech:
  config:
    kafka:
      topics:
        portaria-registro-chegada-almoxarifado: 'aratech.registro.chegada.almoxarifado'
        portaria-registro-chegada-carregamento: 'aratech.registro.chegada.carregamento'
        portaria-registro-chegada-pcp: 'aratech.registro.chegada.pcp'
        almoxarifado-liberar-recebimento: 'almoxarifado-liberar-recebimento'
