<app-navbar />

<main class="app-main">
  <app-breadcrumb [items]="breadcrumb" />
  <div class="container py-5">
    <div class="row g-4 justify-content-center"><div class="col-md-6 col-lg-5" *appPermissao="'CARREGAMENTO_EXPEDICAO.CONSULTAR'"><a routerLink="/carregamento/expedicao" class="card card-menu h-100"><div class="d-flex flex-column align-items-center justify-content-center h-100"><i class="bi bi-box-arrow-right icon-size"></i><h4 class="fw-bold mb-2">Expedição da produção</h4><p class="text-muted text-center mb-0">Ordens concluídas e saída vinculada ao caminhão presente</p></div></a></div>

      <div *appPermissao="'CARREGAMENTO_ASSISTENCIA.CONSULTAR'" class="col-md-6 col-lg-5">
        <a routerLink="/carregamento/assistencia" class="card card-menu h-100">
          <div class="d-flex flex-column align-items-center justify-content-center h-100">
            <i class="bi bi-tools icon-size"></i>
            <h4 class="fw-bold mb-2">Assistência</h4>
            <p class="text-muted text-center mb-0">Acompanhamento das cargas em assistência técnica</p>
          </div>
        </a>
      </div>

      <div *appPermissao="'CARREGAMENTO_CHEGADAS.CONSULTAR'" class="col-md-6 col-lg-5">
        <a routerLink="/carregamento/cargas-descargas" class="card card-menu h-100">
          <div class="d-flex flex-column align-items-center justify-content-center h-100">
            <i class="bi bi-truck icon-size"></i>
            <h4 class="fw-bold mb-2">Recebimento</h4>
            <p class="text-muted text-center mb-0">Caminhões aguardando liberação para carga ou descarga</p>
          </div>
        </a>
      </div>

    </div>
  </div>
</main>
