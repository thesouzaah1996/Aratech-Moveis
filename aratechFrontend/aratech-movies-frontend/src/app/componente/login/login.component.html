<div class="top-progress" [class.active]="isLoading" aria-hidden="true"></div>

<main class="page" role="main">
  <section class="card" aria-labelledby="loginTitle">

    <header class="brand">
      <img src="/img/aratech-logo-login-branco.png" alt="Aratech Móveis" class="login-logo" />
    </header>

    <form novalidate (ngSubmit)="onSubmit()">

      <div class="field"
           [class.login-error]="loginState === 'error' || loginState === 'blocked'">
        <label for="email">E-mail corporativo</label>
        <input id="email" name="email" type="email"
               inputmode="email" autocomplete="username" maxlength="150"
               autocapitalize="off" spellcheck="false"
               required placeholder="nome@aratechmoveis"
               [(ngModel)]="email"
               [class.is-invalid]="!!emailError"
               (input)="clearState()" />
        @if (emailError) {
          <small class="err">{{ emailError }}</small>
        }
      </div>

      <div class="field"
           [class.login-error]="loginState === 'error' || loginState === 'blocked'">
        <label for="password">Senha</label>
        <div class="password-wrap">
          <input id="password" name="password"
                 [type]="showPassword ? 'text' : 'password'"
                 autocomplete="current-password"
                 required placeholder="••••••••"
                 [(ngModel)]="password"
                 [class.is-invalid]="!!passwordError"
                 (input)="clearState()" />
          <button class="eye" type="button"
                  [attr.aria-pressed]="showPassword"
                  aria-label="Mostrar ou ocultar senha"
                  (click)="togglePassword()">
            <i class="bi" [class.bi-eye]="showPassword" [class.bi-eye-slash]="!showPassword"></i>
          </button>
        </div>
        @if (passwordError) {
          <small class="err">{{ passwordError }}</small>
        }
      </div>

      <button class="btn btn-primary full" type="submit"
              [disabled]="isLoading">
        Entrar
      </button>

      @if (loginState === 'error') {
        <div class="form-msg error" role="status" aria-live="polite">
          {{ erroLogin }}
        </div>
      }

      @if (loginState === 'blocked') {
        <div class="form-msg error" role="status" aria-live="polite">
          Muitas tentativas de acesso. Aguarde 15 minutos e tente novamente.
        </div>
      }

    </form>
  </section>
</main>

<footer class="app-footer" role="contentinfo">
  <small>© 2026 Aratech Móveis</small>
</footer>
