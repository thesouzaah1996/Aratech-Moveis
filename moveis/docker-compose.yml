# Uma aplicação. O perfil vem de spring.profiles.active em application.yml.
x-banco: &banco
  image: postgres:16
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
    interval: 5s
    timeout: 5s
    retries: 20

services:
  aramoveis-dev:
    <<: *banco
    container_name: aratechmoveis-database-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV:?}
      POSTGRES_USER: ${POSTGRES_USER_DEV:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV:?}
    ports: ['127.0.0.1:${DB_PUBLISHED_PORT_DEV:-5435}:5432']
    volumes: [dev_data:/var/lib/postgresql/data]
    networks: [aratechmoveis]
  aramoveis-homolog:
    <<: *banco
    container_name: aratechmoveis-database-homolog
    environment:
      POSTGRES_DB: ${POSTGRES_DB_HOMOLOG:?}
      POSTGRES_USER: ${POSTGRES_USER_HOMOLOG:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_HOMOLOG:?}
    ports: ['127.0.0.1:${DB_PUBLISHED_PORT_HOMOLOG:-5433}:5432']
    volumes: [homolog_data:/var/lib/postgresql/data]
    networks: [aratechmoveis]
  aramoveis-prod:
    <<: *banco
    container_name: aratechmoveis-database-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PROD:?}
      POSTGRES_USER: ${POSTGRES_USER_PROD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:?}
    ports: ['127.0.0.1:${DB_PUBLISHED_PORT_PROD:-5434}:5432']
    volumes: [prod_data:/var/lib/postgresql/data]
    networks: [aratechmoveis]

  backend:
    container_name: aratechmoveis-backend
    image: aratechmoveis-backend:local
    build: .
    restart: unless-stopped
    mem_limit: 768m
    expose: ['8080']
    ports: ['127.0.0.1:8092:8080']
    volumes:
      - ./src/main/resources/application.yml:/app/config/application.yml:ro
      - ./src/main/resources/application-dev.yml:/app/config/application-dev.yml:ro
      - ./src/main/resources/application-homolog.yml:/app/config/application-homolog.yml:ro
      - ./src/main/resources/application-prod.yml:/app/config/application-prod.yml:ro
    environment:
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=65'
      DB_HOST_DEV: aramoveis-dev
      DB_PORT_DEV: 5432
      POSTGRES_DB_DEV: ${POSTGRES_DB_DEV}
      APP_USER_DEV: ${APP_USER_DEV:?Prepare as contas de banco}
      APP_PASSWORD_DEV: ${APP_PASSWORD_DEV:?Prepare as contas de banco}
      DB_HOST_HOMOLOG: aramoveis-homolog
      DB_PORT_HOMOLOG: 5432
      POSTGRES_DB_HOMOLOG: ${POSTGRES_DB_HOMOLOG}
      APP_USER_HOMOLOG: ${APP_USER_HOMOLOG:?Prepare as contas de banco}
      APP_PASSWORD_HOMOLOG: ${APP_PASSWORD_HOMOLOG:?Prepare as contas de banco}
      DB_HOST_PROD: aramoveis-prod
      DB_PORT_PROD: 5432
      POSTGRES_DB_PROD: ${POSTGRES_DB_PROD}
      APP_USER_PROD: ${APP_USER_PROD:?Prepare as contas de banco}
      APP_PASSWORD_PROD: ${APP_PASSWORD_PROD:?Prepare as contas de banco}
      MINIO_URL: http://host.docker.internal:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY_LOCAL:?}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY_LOCAL:?}
      MINIO_URL_PROD: http://host.docker.internal:9000
      MINIO_ACCESS_KEY_PROD: ${MINIO_ACCESS_KEY_LOCAL}
      MINIO_SECRET_KEY_PROD: ${MINIO_SECRET_KEY_LOCAL}
      MINIO_BUCKET_PROD: aratechmoveis-prod
    depends_on:
      aramoveis-dev: {condition: service_healthy}
      aramoveis-homolog: {condition: service_healthy}
      aramoveis-prod: {condition: service_healthy}
      minio: {condition: service_started}
    networks: [aratechmoveis]

  frontend:
    container_name: aratechmoveis-frontend
    image: aratechmoveis-frontend:local
    build:
      context: ../aratechFrontend/aratech-movies-frontend
      args:
        BUILD_CONFIG: production
        NGINX_CONF: nginx.docker-local.conf
    restart: unless-stopped
    volumes:
      - ./.docker-local/certs:/etc/nginx/certs:ro
    depends_on: [backend]
    ports: ['127.0.0.1:8443:443']
    networks: [aratechmoveis]

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: aratechmoveis-minio
    restart: unless-stopped
    ports: ['9000:9000', '9001:9001']
    volumes: ['./docs:/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_LOCAL:?Configure o MinIO local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY_LOCAL:?Configure o MinIO local}
    command: server /data --console-address ':9001'
    networks: [aratechmoveis]

volumes:
  dev_data: {name: moveis_dev_data}
  homolog_data: {name: moveis_homolog_data}
  prod_data: {name: moveis_prod_data}
networks:
  aratechmoveis:
    name: aratechmoveis
    driver: bridge
