services:
  aramoveis-dev:
    container_name: aratechmoveis-database-dev
    image: postgres:16
    networks:
      - aratechmoveis
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV}
      POSTGRES_USER: ${POSTGRES_USER_DEV}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV}
    ports:
      - "${DB_PUBLISHED_PORT_DEV:-5435}:5432"
    volumes:
      - dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev_data:
    name: moveis_dev_data

networks:
  aratechmoveis:
    name: aratechmoveis
    driver: bridge
