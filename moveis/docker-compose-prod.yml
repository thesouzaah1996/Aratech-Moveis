services:
  aramoveis-prod:
    container_name: aratechmoveis-database-prod
    image: postgres:16
    restart: unless-stopped
    networks:
      - aratechmoveis
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PROD}
      POSTGRES_USER: ${POSTGRES_USER_PROD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD}
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT_PROD:-5434}:5432"
    volumes:
      - prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prod_data:
    name: moveis_prod_data

networks:
  aratechmoveis:
    name: aratechmoveis
    driver: bridge
