networks:
  aratech-network:
    driver: bridge

volumes:
  almoxarifado-db-prod-data:
  login-db-prod-data:
  portaria-db-prod-data:
  recursoshumanos-db-prod-data:
  administracao-db-prod-data:
  manutencao-db-prod-data:

services:

  almoxarifado-db:
    image: postgres:17.4
    container_name: almoxarifado-db-prod
    restart: always
    ports:
      - "5575:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: almoxarifado-prod
    volumes:
      - almoxarifado-db-prod-data:/var/lib/postgresql/data
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  login-db:
    image: postgres:17.4
    container_name: login-db-prod
    restart: always
    ports:
      - "5576:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: login-prod
    volumes:
      - login-db-prod-data:/var/lib/postgresql/data
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  portaria-db:
    image: postgres:17.4
    container_name: portaria-db-prod
    restart: always
    ports:
      - "5577:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portaria-prod
    volumes:
      - portaria-db-prod-data:/var/lib/postgresql/data
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  recursoshumanos-db:
    image: postgres:17.4
    container_name: recursoshumanos-db-prod
    restart: always
    ports:
      - "5578:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recursoshumanos-prod
    volumes:
      - recursoshumanos-db-prod-data:/var/lib/postgresql/data
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  administracao-db:
    image: postgres:17.4
    container_name: administracao-db-prod
    restart: always
    ports:
      - "5579:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: administracao-prod
    volumes:
      - administracao-db-prod-data:/var/lib/postgresql/data
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  manutencao-db:
    image: postgres:17.4
    container_name: manutencao-db-prod
    restart: always
    ports:
      - "5580:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manutencao-prod
    volumes:
      - manutencao-db-prod-data:/var/lib/postgresql/data
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.15
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aratech-network

  kafka:
    image: confluentinc/cp-kafka:7.2.15
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - aratech-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aratech
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - aratech-network

  almoxarifado:
    build: ./almoxarifado
    container_name: almoxarifado
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: producao
      SPRING_DATASOURCE_URL: jdbc:postgresql://almoxarifado-db:5432/almoxarifado-prod
      ALMOXARIFADO_DB_USER_PROD: postgres
      ALMOXARIFADO_DB_PASSWORD_PROD: postgres
      JWT_CHAVE_SECRETA: ${JWT_CHAVE_SECRETA}
    depends_on:
      almoxarifado-db:
        condition: service_healthy
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  login:
    build: ./login
    container_name: login
    restart: always
    ports:
      - "8080:8080"
      - "5506:5506"
    environment:
      SPRING_PROFILES_ACTIVE: producao
      SPRING_DATASOURCE_URL: jdbc:postgresql://login-db:5432/login-prod
      LOGIN_DB_USER_PROD: postgres
      LOGIN_DB_PASSWORD_PROD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMAIL: ${EMAIL}
      SENHA_EMAIL: ${SENHA_EMAIL}
      JWT_CHAVE_SECRETA: ${JWT_CHAVE_SECRETA}
      JWT_TEMPO_EXPIRACAO: ${JWT_TEMPO_EXPIRACAO}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5506
    depends_on:
      login-db:
        condition: service_healthy
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  portaria:
    build: ./portaria
    container_name: portaria
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: producao
      SPRING_DATASOURCE_URL: jdbc:postgresql://portaria-db:5432/portaria-prod
      PORTARIA_DB_USER_PROD: postgres
      PORTARIA_DB_PASSWORD_PROD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      portaria-db:
        condition: service_healthy
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  recursoshumanos:
    build: ./recursoshumanos
    container_name: recursoshumanos
    restart: always
    ports:
      - "8083:8083"
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: producao
      SPRING_DATASOURCE_URL: jdbc:postgresql://recursoshumanos-db:5432/recursoshumanos-prod
      RH_DB_USER_PROD: postgres
      RH_DB_PASSWORD_PROD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      recursoshumanos-db:
        condition: service_healthy
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  administracao:
    build: ./administracao
    container_name: administracao
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: producao
      SPRING_DATASOURCE_URL: jdbc:postgresql://administracao-db:5432/administracao-prod
      ADM_DB_USER_PROD: postgres
      ADM_DB_PASSWORD_PROD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      administracao-db:
        condition: service_healthy
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  manutencao:
    build: ./manutencao
    container_name: manutencao
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: producao
      SPRING_DATASOURCE_URL: jdbc:postgresql://manutencao-db:5432/manutencao-prod
      MANUTENCAO_DB_USER_PROD: postgres
      MANUTENCAO_DB_PASSWORD_PROD: postgres
    depends_on:
      manutencao-db:
        condition: service_healthy
    networks:
      - aratech-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  aratech-frontend:
    build: ./aratechFrontend/aratech-movies-frontend
    container_name: aratech-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      almoxarifado:
        condition: service_healthy
      login:
        condition: service_healthy
      portaria:
        condition: service_healthy
      recursoshumanos:
        condition: service_healthy
      administracao:
        condition: service_healthy
      manutencao:
        condition: service_healthy
    networks:
      - aratech-network
